appId: com.lume.app
productName: Lume
copyright: Copyright © 2026 Lume

directories:
  output: release
  buildResources: build

# Só o necessário para a janela e a bandeja. O agente de terminal (agent.mjs)
# não vai no pacote: quem usa o app não precisa dele.
# @xhayper/discord-rpc fica em dependencies: o electron-builder copia as
# dependências de produção para o pacote mesmo com esta lista restrita.
files:
  - electron/**/*
  - core.mjs
  - domain.mjs
  - update.mjs
  - updater.mjs
  - discord-presence.mjs
  - discord-client.mjs
  - package.json

# Ícones fora do asar, para o nativeImage ler caminho real.
extraResources:
  - from: assets
    to: assets
    filter:
      - "*.png"
  - from: build/icon.png
    to: assets/icon.png

# Gera latest.yml / latest-linux.yml e grava app-update.yml no pacote: é por eles
# que o electron-updater acha a versão nova e troca a instalação por cima.
publish:
  provider: github
  owner: libonatii
  repo: Lume
  releaseType: release

win:
  extraResources:
    - from: build/udemy-runtime
      to: webview2
      filter: ["lume_webview.node", "LICENSE.txt"]
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lume
  artifactName: Lume-setup.${ext}
  # Atualização silenciosa precisa achar e substituir a instalação existente.
  runAfterFinish: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  maintainer: Lume <contato@lumeacademy.site>
  category: Education
  synopsis: Lume — plataforma social de estudos no desktop
  description: Lume completo em uma janela, com bandeja, lembretes, presença local opcional e Rich Presence no Discord.
  desktop:
    entry:
      Name: Lume
      Comment: Plataforma social de estudos
      Categories: Education;Utility;
      StartupWMClass: Lume

appImage:
  artifactName: Lume.${ext}

deb:
  artifactName: Lume.${ext}
